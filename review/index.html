<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs UI Branch Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a review desk. A pinned bar with progress, then the passes in order (Look, Watch, Gates, Calls, Read), the fork note and the full ledger. Every reviewable unit carries its own sign-off. */
:root {
  --bg: #fbfbfc; --surface: #ffffff; --sunk: #f3f3f6; --line: #e2e2e8; --line-strong: #cdcdd6;
  --fg: #1d1d22; --muted: #5f5f6c; --faint: #8a8a97;
  --lime: #c0ff58; --lime-ink: #1d1d22; --link: #497500;
  --ok: #1d7a3c; --ok-bg: #e6f4ea; --check: #9a5600; --check-bg: #fbf0dc; --flag: #b8322a; --flag-bg: #fbe6e4;
  --before: #6b6b78; --shadow: 0 1px 2px rgb(20 20 30 / 6%), 0 4px 16px rgb(20 20 30 / 5%);
  --sans: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Source Code Pro", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111114; --surface: #18181c; --sunk: #1f1f25; --line: #2b2b33; --line-strong: #3b3b45;
  --fg: #ececf0; --muted: #a3a3b0; --faint: #7c7c89;
  --lime: #c0ff58; --lime-ink: #111114; --link: #c0ff58;
  --ok: #5ec27e; --ok-bg: #16281c; --check: #f0a640; --check-bg: #2e2312; --flag: #ff7468; --flag-bg: #301716;
  --before: #9a9aa8; --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111114; --surface: #18181c; --sunk: #1f1f25; --line: #2b2b33; --line-strong: #3b3b45;
  --fg: #ececf0; --muted: #a3a3b0; --faint: #7c7c89;
  --lime: #c0ff58; --lime-ink: #111114; --link: #c0ff58;
  --ok: #5ec27e; --ok-bg: #16281c; --check: #f0a640; --check-bg: #2e2312; --flag: #ff7468; --flag-bg: #301716;
  --before: #9a9aa8; --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--link); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.2; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* pinned bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; padding-block: 6px; flex-wrap: wrap; }
.bar .name { font-weight: 700; white-space: nowrap; }
.bar nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.bar nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 15px; }
.bar nav a:hover { color: var(--fg); background: var(--sunk); }
@media (max-width: 760px) {
  .bar .wrap { gap: 4px 12px; padding-block: 8px 4px; }
  .bar nav { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -10px; }
  .bar nav a { white-space: nowrap; }
  .progress { margin-left: auto; }
}
.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.meter { width: 120px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--lime); border-right: 1px solid var(--lime-ink); transition: width .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

/* intro */
header.intro { padding-block: 40px 8px; }
.eyebrow { font: 600 13px/1 var(--mono); color: var(--muted); letter-spacing: .02em; }
header.intro h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; margin-top: 12px; letter-spacing: -0.01em; }
.lead { font-size: 18px; color: var(--muted); max-width: 64ch; margin: 12px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--fg); font-weight: 600; }
.passes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 28px; }
.pass { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: inherit; }
.pass:hover { border-color: var(--line-strong); }
.pass .k { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pass .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pass .d { font-size: 14px; color: var(--muted); }
.pass .mine { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.notice { margin-top: 18px; padding: 10px 14px; border-radius: 8px; background: var(--sunk); color: var(--muted); font-size: 14px; }

/* sections */
section.pass-section { padding-block: 48px 8px; scroll-margin-top: 64px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 10px; margin-bottom: 8px; }
.sec-head h2 { font-size: 28px; font-weight: 700; }
.sec-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { font: 600 14px var(--sans); padding: 6px 12px; background: var(--surface); color: var(--muted); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.stop { padding-top: 32px; scroll-margin-top: 64px; }
.stop > h3 { font-size: 21px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stop > h3 .where { font: 400 14px var(--mono); color: var(--muted); }

.unit { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); scroll-margin-top: 64px; }
.unit-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.unit-head h4 { font-size: 17px; font-weight: 700; flex: 1; min-width: 200px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--sans); padding: 4px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.check { background: var(--check-bg); color: var(--check); }
.chip.flag { background: var(--flag-bg); color: var(--flag); }
.sha { font: 600 12.5px var(--mono); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; cursor: copy; }

/* image pairs */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pair figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pair figcaption, .flip-label { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; }
.cap-before { color: var(--before); }
.cap-after { color: var(--fg); display: inline-flex; gap: 6px; align-items: center; }
.cap-after::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--lime); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 25%); }
.shot { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); overflow: hidden; cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; }
.pair.flip { grid-template-columns: 1fr; }
.flip-box { display: flex; flex-direction: column; gap: 6px; }
.flip-box .shot { cursor: pointer; }
.flip-hint { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }

.items { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
.items li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 15px; }
.items li .gone { color: var(--muted); font-style: italic; }
.note { margin-top: 10px; font-size: 14px; color: var(--muted); }

/* videos */
.vids { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.vids figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.vids video { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #000; }
@media (max-width: 760px) { .vids { grid-template-columns: 1fr; } }
.steps { margin: 12px 0 0; padding-left: 22px; font-size: 15px; }
.expect { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; font-size: 14px; }
.expect div { padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.expect b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.btn { font: 600 14px var(--sans); padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn:hover { background: var(--sunk); }

/* gates */
.gate-summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.gate-group { margin-top: 28px; }
.gate-group > h3 { font-size: 19px; }
.gate-group > p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.gate { margin-top: 10px; padding: 12px 14px; }
.gate .vals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.gate .val { min-width: 0; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font: 12.5px/1.45 var(--mono); overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.gate .val b { display: block; font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.gate .val.pass b::after { content: " · pass"; color: var(--ok); }
.gate .val.fail b::after { content: " · fail"; color: var(--flag); }
.gate p.checks { margin: 8px 0 0; font-size: 15px; }
.gate details { margin-top: 8px; }
.gate summary { cursor: pointer; font-size: 14px; color: var(--muted); }
.gate pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sunk); font: 12.5px/1.5 var(--mono); overflow-x: auto; }
@media (max-width: 760px) { .gate .vals { grid-template-columns: 1fr; } }

/* calls, read, ledger */
.call-group { margin-top: 28px; }
.call-group > h3 { font-size: 19px; }
.call p { margin: 8px 0 0; font-size: 15px; max-width: 80ch; }
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 14px; color: var(--muted); }
.table-wrap { overflow-x: auto; margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--sunk); position: sticky; top: 0; }
tr.superseded td { color: var(--faint); }
td.plain { min-width: 280px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.filters input, .filters select { font: 15px var(--sans); padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--fg); }
.filters input { min-width: 0; flex: 1 1 220px; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
.cmd pre { flex: 1; min-width: 0; margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--sunk); font: 13px/1.5 var(--mono); overflow-x: auto; }

/* sign-off */
.sign { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.sign[hidden] { display: none; }
.sign .mark { font: 600 14px var(--sans); padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; }
.sign .mark:hover { background: var(--sunk); }
.sign .mark[aria-pressed="true"].ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.sign .mark[aria-pressed="true"].flag { background: var(--flag-bg); color: var(--flag); border-color: var(--flag); }
.sign input { flex: 1 1 220px; min-width: 0; font: 14px var(--sans); padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--fg); }
.others { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.who img { width: 20px; height: 20px; border-radius: 50%; }
.who.ok { color: var(--ok); } .who.flag { color: var(--flag); }
.flagnotes { width: 100%; margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--flag); }
footer { padding-block: 56px 72px; color: var(--muted); font-size: 14px; }
</style>

ata-sticky-floor]').getBoundingClientRect().top` (the bottom of the visible bars, present on both builds). Count it covered when `r.top \u003c floor - 1 && r.bottom > 0`.","base_expected":"Clearly non-zero. Handoff 04 counted 41 of 150 at 1440 and 36 at 390 on dev.","head_expected":"0 covered at both widths."},"diff":null,"judgement":"Accepted trade-offs. WebKit can leave a 9 to 16px partial cover when a bar is released mid push-out (2 of 50 stops). PageDown skips about 64px more while focus sits in the sticky local nav or phone nav. A keyboard-picked search hit reveals the phone nav. Held Shift+Tab into the hidden nav jumps more than once. Viewports under about 265px tall can leave a link 6px under the local nav. The commit also edits handoff 05's useNavHidden.ts. Tab no longer counts as a user scroll, and keyboard focus in the nav reveals it.","regression_watch":"Hash landings must not move (h3 at 121 vs floor 113, h4 at 182 vs 158, phone h2 at 48). Search landings at top 63 desktop and 111 phone. Scrolling at 4x CPU stays at p95 16.7ms with StickyHeading about 0.9ms a frame, since the inline scroll-padding is written only when it changes. Focus in the local nav or phone nav must not drift the page (the two `:has` rules).","superseded_by":null},{"sha":"f01a81ed","subject":"fix(sidebar): take the closed phone sidebar out of the tab order","handoff":"04","item":"4.2","area":"sidebar","plain":"On phones and small tablets the closed sidebar no longer takes keyboard focus. Its slide-out looks the same.","method":"GATE","secondary":"TRY","look":null,"try":{"path":"/docs/30.2/api/search.html","viewport":"390x844","steps":["Tap the menu icon at the left of the bar under the nav to open the sidebar.","Tap outside it to close it and watch it slide out.","Reload, then press Tab about 15 times from the top."],"expect_head":"The drawer slides in and out as before. Tab never lands on an invisible sidebar link.","expect_base":"Same slide. Tab stops 7 and 8 land on 'Introduction' d":false,"setup":"Follow the link as in the TRY steps. Wait until location.hash is '#schema-parameters', then 800ms.","measure":"Read document.activeElement (tagName, id) and window.scrollY. Press Tab, then read document.activeElement and window.scrollY again.","base_expected":"activeElement is the hidden SPAN just before `.VPSkipLink`. After Tab, activeElement is `.VPSkipLink` and scrollY is 0.","head_expected":"activeElement.id is 'schema-parameters'. After Tab, focus is inside `.vp-doc` and scrollY is within a few px of the landing."},"diff":null,"judgement":"Accepted trade-offs. A version switch from the phone menu on a #hash URL can't focus the target, because the content is still inert (focus ends on body, as on base). Back or forward to a hash focuses the target while history restores another scroll position. A stray % in a hand-written hash throws in the route watcher, no content link has one. This commit also moves the skip link into a Tailwind shadow of VPSkipLink.vue.","regression_watch":"The skip link must still show top-left on focus in both themes with the same look (8px inset, 14px/16px from 1280, bold brand text, shadow 3). Parameter `\u003cspan id>` targets get a temporary tabindex=-1, and 705326e8 later drops their focus ring. Search landings stay at top 63 desktop and 111 phone.","superseded_by":null},{"sha":"64ec5980","subject":"fix(nav): skip straight to the article","handoff":"04","item":"4.5","area":"nav","plain":"'Skip to content' now lands in the article itself. The version picker and the outline no longer come first.","method":"TRY","secondary":"GATE","look":null,"try":{"path":"/docs/30.2/api/search.html","viewport":"1440x900","steps":["Load the page and press Tab once to reveal 'Skip to content'.","Press Enter.","Press Tab."],"expect_head":"Focus lands on the first control in the article, the title's # anchor or the Copy Markdown button.","expect_base":"Focus lands on the version picker in the right column, and 37 outline links follow befo  the 'Return to top' to 'On this page' swap doesn't show here.","seen":false,"note":"Shown in phone-tabs instead, where base reads Return to top and HEAD reads On this page."}],"note":"The search icon (780722ac) and the Quick Start line (4fc72719) also differ."}]}],"walks":[{"id":"W1","title":"Code tabs from the keyboard","page":"/docs/30.2/api/documents.html","viewport":"1280x800 (phone clip 390x844, isMobile, hasTouch)","shas":["5ed71446","ba82008a","eb4869bf","9f5824f1","b38e1318","9a961159"],"steps":["Scroll to 'Index a single document' and click in the paragraph 'Let's see how we can add a new document to a collection.'","Press Tab once","Press ArrowRight twice, then ArrowLeft once","Click 'Go' in the same strip with the mouse","Scroll to the first 'Sample Response' and drag from that line down into the JSON code below it","Phone clip: at 390px scroll the first tab strip sideways so JavaScript sits half under the left edge fade, click the paragraph above it, press Tab, then ArrowLeft"],"expect_head":"Tab lands on JavaScript with a lime inset ring. Each arrow selects the next tab at once (PHP, Python, then back to PHP after ArrowLeft) and every group on the page switches while the strip stays put. Clicking Go glides the pill. The drag highlights 'Sample Response' and the code but not the 'JSON' label. Phone: Tab scrolls the strip so JavaScript sits fully clear of the fade with its ring, and ArrowLeft wraps to 'Other Languages', fully clear of the right fade.","expect_base":"Tab skips the strip and rings the hidden code copy button. The arrows change nothing. Go still works with the mouse. The drag highlights the 'JSON' label too. Phone: Tab focuses the whole strip as a scroll box, and ArrowLeft only scrolls it back.","note":"Checked from frame sheets of all four clips. Not visible on video, so left to gates: ba82008a (lone tabs are not a Tab stop, gate tabs-lone-tab-not-a-stop), eb4869bf (arrows step from the focused tab, gate tabs-arrow-steps-from-focused-tab) and 9f5824f1 (the lone label shows no pointer and a click doesn't save 'JSON', gate tabs-lone-tab-unclickable). Headless video draws no mouse cursor. The drag highlight is small in the clip, pause near the end to see it.","clips":[{"label":"","base":"walks/W1/base.webm","head":"walks/W1/head.webm"},{"label":"phone","base":"walks/W1/base-phone.webm","head":"walks/W1/head-phone.webm"}]},{"id":"W2","title":"Image zoom from the keyboard","page":"/docs/guide/high-availability.html","viewport":"1280x800","shas":["db6f668e","529af28e","0e6dbad4","7d6f6435"],"steps":["Click in the paragraph just above the 'Typesense Cloud HA Hostnames' screenshot ('When you flip the setting ON...')","Press Tab","Press Enter","Press Tab","Click the screenshot with the mouse and wait for the zoom to finish","Press Tab"],"expect_head":"Tab lands on the screenshot. Enter opens the zoom and Tab closes it with focus back on the screenshot. After a mouse zoom, Tab also closes it and focus lands back on the screenshot. The page never moves.","expect_base":"Tab skips the screenshot and lands on the 'Client Configuration' link in the note further down, and Enter follows that link to its section. After a mouse zoom, Tab moves focus to that link behind the overlay. The page scrolls to it, which closes the zoom.","note":"Checked from frame sheets. The screenshot's focus ring is Chrome's default 1px auto outline, not the site's lime ring, and it is hard to see against the image's own blue frame. The clip shows focus by what Enter and Tab do, not by a ring. 0e6dbad4 (clicking the zoomed image shut returns focus) has no visible effect and is covered by gate zoom-click-close-returns-focus.","clips":[{"label":"","base":"walks/W2/base.webm","head":"walks/W2/head.webm"}]},{"id":"W3","title":"Copy menu and version picker from the keyboard","page":"/docs/30.2/api/collections.html","viewport":"1440x900","shas":["2547430e","ba4383af","547c3e8d"],"steps":["Press Tab until the braces button next to Copy Markdown is focused, then press Enter","Press Tab to reach the first language (JavaScript) and press Space","Press Escape","Press Tab until the v30.2 version picker in the right column is focused, then press Enter","Type 0.23 quickly","Press End","Press ArrowUp","Press Escape"],"expect_head":"Enter opens the menu on Select all. Tab rings the JavaScript checkbox and Space ticks it. In the version list, typing 0.23 moves the highlight to v0.23.1, End moves it to the last row v0.11.2, and ArrowUp to v0.12.0. Escape closes the list with focus on the picker.","expect_base":"The copy menu looks and toggles the same, with an outer offset ring on the row. Typing 0.23 leaves the highlight on v30.2. End drops the highlight and ArrowUp does nothing. Escape still closes the list.","note":"Checked from frame sheets. 2547430e changes what a screen reader hears (a named checkbox with its ticked state), so its menu half looks almost the same on both builds. The gate copy-languages-are-checkboxes shows the difference. Ticking JavaScript also sets it as the shown tab, which is existing behaviour.","clips":[{"label":"","base":"walks/W3/base.webm","head":"walks/W3/head.webm"}]},{"id":"W4","title":"Skip link and landing focus","page":"/docs/30.2/api/search.html","viewport":"1440x900","shas":["64ec5980","08c5cbf5","d74ea978"],"steps":["Load /docs/30.2/api/search.html at 1440x900 and press Tab once. \"Skip to content\" appears top left.","Press Enter, then Tab.","Move focus to the 'this table' link in the split_join_tokens row of the Typo-Tolerance parameters table (it points at collections.html#schema-parameters) and press Enter.","When collections.html has landed on 'Schema parameters', press Tab.","Back on search.html, scroll until the 'scoped API key' link in the Caching parameters table sits just under the pinned bars. Click the text of the 'Filter Results' heading just below that table.","Press Shift+Tab twice and watch each focus ring."],"expect_head":"After the skip, Tab lands on the title's # anchor in the article. After the cross-page link, Tab moves to the next control at 'Schema parameters' and the page stays put. The first Shift+Tab scrolls 'scoped API key' out from under the pinned bars and its ring shows.","expect_base":"After the skip, Tab lands on the v30.2 version picker in the right column. After the cross-page link, Tab focuses 'Skip to content' and the page jumps to the top. The first Shift+Tab puts focus on 'scoped API key' while it sits hidden under the pinned 'Caching parameters' bar, so no ring shows and the page doesn't move.","note":"Checked frames. After the skip HEAD rings the title # and base rings v30.2 in the aside. After the cross-page landing HEAD rings the Schema parameters # in place and base shows Skip to content at the top. On the first Shift+Tab HEAD scrolls scoped API key into view with its ring, base shows no ring because the link sits under the Caching parameters bar. The video runs about 0.5 to 1s behind the keys badge.","clips":[{"label":"","base":"walks/W4/base.webm","head":"walks/W4/head.webm"}]},{"id":"W5","title":"Phone menu, sidebar drawer and outline dropdown","page":"/docs/30.2/api/search.html","viewport":"390x844 touch","shas":["6c40f66a","f01a81ed","4bcb92ad"],"steps":["Load /docs/30.2/api/search.html at 390x844 (touch) and tap the hamburger at the top right.","Press Tab 15 times.","Press Escape. If the menu is still open, tap the hamburger again to close it.","Press Tab 4 times.","Move focus to 'On this page' in the bar under the nav and press Enter, then Tab into the list.","Press Escape, then Tab once."],"expect_head":"Tab cycles through the nav bar and menu only and is back on 'Docs Home' after 15. Escape closes the menu and focus sits on the hamburger. The next four Tabs go Menu, v30.2, On this page, then the article. Escape in the outline list closes it with focus back on 'On this page', and Tab carries on into the article.","expect_base":"From the 11th Tab focus leaves the menu for 'Menu', 'On this page' and sidebar links hidden behind the overlay, so no ring shows. Escape does nothing. With the menu closed, Tabs 3 and 4 land on sidebar links off screen and no ring shows. Escape in the outline list drops focus to the page, and the next Tab lands on an off-screen sidebar link.","note":"Checked frames. After 15 Tabs HEAD rings Docs Home inside the menu and base shows no ring. After Escape HEAD has closed the menu with the ring on the hamburger and base is still open. After the outline Escape and one Tab, HEAD rings the title # and base shows nothing because focus sits on an off-screen sidebar link. Base clip has one extra tap to close the menu. No video cursor, taps are not drawn.","clips":[{"label":"","base":"walks/W5/base.webm","head":"walks/W5/head.webm"}]},{"id":"W6","title":"Tablet extra menu and sidebar groups","page":"/docs/30.2/api/search.html","viewport":"1024x768","shas":["f2ad9046","9b561402","e5046597"],"steps":["Load /docs/30.2/api/search.html at 1024x768 and hover the '•••' button at the right of the nav bar.","Move the mouse away, then Tab to '•••' and press Enter.","Press Escape.","Tab into the sidebar until 'API Resources' has focus, then press Enter.","Press Tab."],"expect_head":"Hover does nothing. Enter opens the menu, Escape closes it and the ring is back on '•••'. Enter collapses API Resources and Tab goes straight to 'API Errors'.","expect_base":"Hover opens the menu. Enter opens it, Escape leaves it open. Enter collapses API Resources, then Tab stops on its unlabelled caret first.","note":"Checked frames. Hover opens the menu on base only. After Escape HEAD has closed it with the ring on the dots button and base is still open. After Enter and Tab on API Resources HEAD rings API Errors and base rings the caret. Playwright video draws no cursor, so the hover shows only through its effect. 9b561402 (closing on resize) is not in the clip, the gate extra-menu-closes-with-trigger covers it.","clips":[{"label":"","base":"walks/W6/base.webm","head":"walks/W6/head.webm"}]},{"id":"W7","title":"Phone nav while scrolling","page":"/docs/30.2/api/search.html","viewport":"390x844","shas":["84a244e4","6d3748cf"],"steps":["On a phone (390x844), open /docs/30.2/api/search.html and swipe down about 3000px so the top nav hides.","Swipe back up about 30px so the nav slides in.","Let the finger drift 4px down, one pixel at a time.","Swipe down properly, about 100px.","Tap 'On this page' in the bar under the nav to open the panel.","With the panel open, swipe up about 30px."],"expect_head":"The nav stays during the 4px drift and hides on the real swipe. With the panel open, the nav stays hidden and the panel stays where it was, its bottom inside the screen.","expect_base":"The nav hides again on the first pixel of drift. With the panel open, the nav slides back in and pushes the bar and panel 64px down, so the panel runs past the bottom of the screen.","note":"Frames checked. HEAD keeps the nav after the 4px drift (5.9s) and keeps it hidden with the panel open while scrolling up (8.8s to 10.2s, panel bottom 798 of 844). Base hides the nav on the drift (6.5s) and slides it back in with the panel open, pushing the panel down (9.6s on, panel bottom 862). Light theme. A badge bottom left shows keys pressed and one bottom right names the step. The search cluster and trackers are blocked.","clips":[{"label":"","base":"walks/W7/base.webm","head":"walks/W7/head.webm"}]},{"id":"W8","title":"Sidebar pill between pages","page":"/docs/guide/ranking-and-relevance.html","viewport":"1440x900","shas":["a253eacf","1dc95b1e"],"steps":["Open /docs/guide/ranking-and-relevance.html at 1440x900 and click the 'Getting Started' group title to collapse it. 'Tuning Ranking and Relevance' moves up about 174px.","Click 'Tips for Filtering Data in Typesense' in the same sidebar.","Click 'API Reference' in the top nav to switch to the API sidebar."],"expect_head":"Step 1 the pill moves with its row in the same frame. Step 2 it glides about 300ms to the new row. Step 3 it appears on the new item with no slide.","expect_base":"Step 1 the pill trails its row for about 150ms and briefly marks the wrong row. Step 2 glides. Step 3 slides in from the old sidebar position.","note":"Recorded with CSS animations and transitions at quarter speed (CDP Animation.setPlaybackRate 0.25) so the 150ms trail and the 300ms glide are visible at 25fps. At full speed the trail is about 4 frames. Frames checked with animations at quarter speed. Base: after the collapse the pill sits on Running in Production, then Tips for Locale, then Tips for Searching before reaching Tuning Ranking (2.25s to 2.9s). HEAD: the pill is on Tuning Ranking in every frame after the collapse. On the API Reference switch base slides the pill up from JOINs to Introduction (6.3s to 7.3s), HEAD shows it on Introduction straight away (5.8s). Light theme. A badge bottom left shows keys pressed and one bottom right names the step. The search cluster and trackers are blocked.","clips":[{"label":"","base":"walks/W8/base.webm","head":"walks/W8/head.webm"}]},{"id":"W9","title":"Opening search","page":"/docs/30.2/api/search.html and /docs/nope.html","viewport":"1440x900","shas":["780722ac","f93c0c38"],"steps":["Open /docs/30.2/api/search.html at 1440x900 and leave the mouse alone. Press Cmd+K (Ctrl+K off Apple), then Escape.","Reload and click the nav search button once, then press Escape.","Open /docs/nope.html. Wait for 'Page not found' and click 'search the docs' in the sentence under it."],"expect_head":"Cmd+K and the first click each open the modal on the first try with focus in the input, while the library loads behind the static button. On the 404, 'search the docs' is a lime underlined link-style button that opens the same modal.","expect_base":"Cmd+K and the click open the modal the same way (the library was already in the main bundle). On the 404, 'search the docs' is plain grey text and clicking it does nothing.","note":"The 404's title search is answered with {\"grouped_hits\": []} so its suggestion list stays empty on both builds. No query is typed. Frames checked. Both builds open the modal on Cmd+K and on the first click. On the 404 HEAD shows 'search the docs' underlined in lime and the modal opens on click (9.4s). Base shows plain grey text and nothing opens (15.0s to 16.4s). Light theme. A badge bottom left shows keys pressed and one bottom right names the step. The search cluster and trackers are blocked.","clips":[{"label":"","base":"walks/W9/base.webm","head":"walks/W9/head.webm"}]},{"id":"W10","title":"Phone version switch and parameter links","page":"/docs/30.2/api/server-configuration.html","viewport":"390x844","shas":["fc63b9ee","e1d57f93"],"steps":["On a phone (390x844), open /docs/30.2/api/server-configuration.html and look at the breadcrumb row under the nav.","Tap the version at the start of the breadcrumb, look at the list, then tap the same version to close it.","Scroll to the Common Parameters table and look at the parameter names.","Tap the muted # before --api-key."],"expect_head":"The breadcrumb starts with a tappable v30.2 that opens the version list. Each parameter shows a muted # before its name. Tapping it puts #--api-key in the URL and lands that row just under the pinned bars.","expect_base":"The breadcrumb has no version on phones. Parameter names stand alone with no # and nothing to tap.","note":"From 768px up HEAD hides this breadcrumb version again so tablets show one picker (fc63b9ee). That width is covered by the one-version-picker-per-width gate, not this clip. Frames checked. HEAD shows v30.2 first in the breadcrumb, the tap opens the version list (3.3s), each parameter has a muted # and tapping the --api-key # lands that row under the pinned bars with #--api-key in the URL (7.4s). Base has no breadcrumb version and no #. Light theme. A badge bottom left shows keys pressed and one bottom right names the step. The search cluster and trackers are blocked.","clips":[{"label":"","base":"walks/W10/base.webm","head":"walks/W10/head.webm"}]}],"gates":[{"id":"tabs-are-a-tablist","title":"Screen readers hear code tabs as a tab list with the selected tab","shas":["5ed71446"],"kind":"aria","expect":"flip","checks":"Reads the first code tab strip on documents.html. Passes when the strip is role=tablist, every tab is a role=tab with aria-selected, exactly one tab is a Tab stop, and each tab points at a role=tabpanel labelled by it.","base":{"pass":false,"value":{"strip":"UL role=null","tabs":0,"selected":[],"tabStops":0,"panelsOk":false,"axTree":"- list: - listitem: JavaScript - listitem: PHP"}},"head":{"pass":true,"value":{"strip":"DIV role=tablist","tabs":10,"selected":["JavaScript"],"tabStops":1,"panelsOk":true,"axTree":"- tablist: - tab \"JavaScript\" [selected] - tab \"PHP\""}},"verdict":"ok","group":"g1-tabs-controls","code":"context: {\"viewport\":{\"width\":1280,\"height\":800}}\nrun: async ({ page, url }) => {\n      await openTabs(page, url)\n      const v = await page.evaluate(() => {\n        const strip = document.querySelector('[data-copy-tabs]')\n        const tabs = [...strip.querySelectorAll('[role=tab]')]\n        const panelsOk = tabs.every(t => {\n          const p = document.getElementById(t.getAttribute('aria-controls'))\n          return p && p.getAttribute('role') === 'tabpanel' && p.getAttribute('aria-labelledby') === t.id\n        })\n        return {\n          strip: `${strip.tagName} role=${strip.getAttribute('role')}`,\n          tabs: tabs.length,\n          selected: tabs.filter(t => t.getAttribute('aria-selected') === 'true').map(t => t.textContent.trim()),\n          tabStops: tabs.filter(t => t.tabIndex === 0).length,\n          panelsOk: tabs.length > 0 && panelsOk,\n        }\n      })\n      const ax = (await page.locator('[data-copy-tabs]').first().ariaSnapshot()).split('\\n')\n      v.axTree = ax\n        .slice(0, 3)\n        .map(l => l.trim())\n        .join(' ')\n      return {\n        pass:\n          v.strip.endsWith('role=tablist') &&\n          v.tabs === 10 &&\n          v.selected.length === 1 &&\n          v.tabStops === 1 &&\n          v.panelsOk &&\n          ax[0] === '- tablist:' &&\n          ax[1].includes('[selected]'),\n        value: v,\n      }\n    }","finding":null},{"id":"tabs-arrow-keys-switch-language","title":"Tab reaches the code tabs and the arrow keys switch the language everywhere","shas":["5ed71446"],"kind":"keyboard","expect":"flip","checks":"Clicks the paragraph above the first strip on documents.html, presses Tab, then ArrowRight twice and ArrowLeft once. Passes when Tab lands on the JavaScript tab and the arrows leave PHP focused and selected in every group that has PHP.","base":{"pass":false,"value":{"afterTab":"button \"Copy code\"","afterArrows":"button \"Copy code\"","groupsOnPHP":"0 of 13"}},"head":{"pass":true,"value":{"afterTab":"button[tab] \"JavaScript\"","afterArrows":"button[tab] \"PHP\"","groupsOnPHP":"13 of 13"}},"verdict":"ok","group":"g1-tabs-controls","code":"context: {\"viewport\":{\"width\":1280,\"height\":800}}\nrun: async ({ page, url }) => {\n      await openTabs(page, url)\n      await clickText(page, firstStripParagraph(page))\n      await page.keyboard.press('Tab')\n      const afterTab = await focused(page)\n      await page.keyboard.press('ArrowRight')\n      await page.keyboard.press('ArrowRight')\n      await page.keyboard.press('ArrowLeft')\n      await frames(page)\n      const afterArrows = await focused(page)\n      const groups = await selectedTabs(page)\n      const php = groups.filter(t => t === 'PHP').length\n      return {\n        pass: afterTab === 'button[tab] \"JavaScript\"' && afterArrows === 'button[tab] \"PHP\"' && php === groups.length,\n        value: { afterTab, afterArrows, groupsOnPHP: `${php} of ${groups.length}` },\n      }\n    }","finding":null},{"id":"tabs-lone-tab-not-a-stop","title":"Tabbing through the page never stops on a lone \"JSON\" label","shas":["ba82008a"],"kind":"focus-order","expect":"guard","checks":"Base never had focusable tabs, so this guards HEAD. Reads the tabIndex of every lone tab on documents.html, then clicks the first \"Sample Response\" line and presses Tab 6 times. Passes when no lone tab has tabIndex 0 and no stop lands inside a lone strip.","base":{"pass":true,"value":{"loneTabs":11,"loneTabIndex":[-1],"stops":["Copy code","{\n  \"id\": \"124\",\n  \"","bulk import API","High-volume writes i","​","Copy this section as Markdown"]}},"head":{"pass":true,"value":{"loneTabs":11,"loneTabIndex":[-1],"stops":["Copy code","{\n  \"id\": \"124\",\n  \"","bulk import API","High-volume writes i","​","Copy this section as Markdown"]}},"verdict":"ok","group":"g1-tabs-controls","code":"context: {\"viewport\":{\"width\":1280,\"height\":800}}\nrun: async ({ page, url }) => {\n      await openTabs(page, url)\n      const lone = await page.evaluate(() =>\n        [...document.querySelectorAll('[data-copy-tabs]')]\n          .map(s => [...s.children].filter(c => !c.hasAttribute('aria-hidden')))\n          .filter(kids => kids.length === 1)\n          .map(([tab]) => tab.tabIndex),\n      )\n      await clickText(page, page.locator('.vp-doc p', { hasText: /^Sample Response$/ }).first())\n      const stops = []\n      for (let i = 0; i \u003c 6; i++) {\n        await page.keyboard.press('Tab')\n        stops.push(\n          await page.evaluate(() => {\n            const a = document.activeElement\n            const strip = a.closest('[data-copy-tabs]')\n            const lone = strip && [...strip.children].filter(c => !c.hasAttribute('aria-hidden')).length === 1\n            return lone ? `LONE ${a.textContent.trim()}` : a.getAttribute('title') || a.textContent.trim().slice(0, 20)\n          }),\n        )\n      }\n      return {\n        pass: lone.length > 0 && lone.every(t => t === -1) && !stops.some(s => s.startsWith('LONE')),\n        value: { loneTabs: lone.length, loneTabIndex: [...new Set(lone)], stops },\n      }\n    }","finding":null},{"id":"tabs-focus-clears-strip-edges","title":"A keyboard-focused tab on a phone scrolls fully clear of the strip edge fades","shas":["9a961159"],"kind":"focus-order","expect":"head","checks":"At 390px scrolls the first strip 40px sideways so JavaScript sits under the left fade, clicks the paragraph above and presses Tab. Passes when the focused JavaScript tab sits at least 16px inside both strip edges. Base has no focusable tabs, so only HEAD counts.","base":{"pass":false,"value":{"tab":"not a tab: UL","left":0,"right":0}},"head":{"pass":true,"value":{"tab":"JavaScript","left":16,"right":305.3}},"verdict":"ok","group":"g1-tabs-controls","code":"context: {\"viewport\":{\"width\":390,\"height\":844},\"isMobile\":true,\"hasTouch\":true}\nrun: async ({ page, url }) => {\n      await openTabs(page, url)\n      const para = firstStripParagraph(page)\n      await para.scrollIntoViewIfNeeded()\n      await page.evaluate(() => (document.querySelector('[data-copy-tabs]').scrollLeft = 40))\n      await clickText(page, para)\n      await page.keyboard.press('Tab')\n      await wait(100)\n      const value = await page.evaluate(() => {\n        const a = document.activeElement\n        const s = document.querySelector('[data-copy-tabs]').getBoundingClientRect()\n        const r = a.getBoundingClientRect()\n        return {\n          tab: a.matches('[role=tab]')\n            ? a.textContent.trim()\n            : `not a tab: ${a.tagName} ${a.getAttribute('title') || ''}`.trim(),\n          left: Math.round((r.left - s.left) * 10) / 10,\n          right: Math.round((s.right - r.right) * 10) / 10,\n        }\n      })\n      return { pass: value.tab === 'JavaScript' && value.left >= 15.5 && value.right >= 15.5, value }\n    }","finding":null},{"id":"tabs-in-server-html","title":"Code tabs are in the page before JavaScript runs","shas":["8c75edf5"],"kind":"ssr-html","expect":"flip","checks":"Loads search.html at 390px with JavaScript off. Counts role=tablist strips and reads wheth

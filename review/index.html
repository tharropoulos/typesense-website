  select.hash === '' &&\n        hashAfterEnter === '#--config'\n      return { pass, value: { ...rest, hoveredOpacity: hovered, ...select, hashAfterEnter } }\n    }","finding":null},{"id":"search-opens-every-way","title":"Search opens on the first click, Cmd+K and /, before and after the library loads","shas":["780722ac"],"kind":"dom","expect":"guard","checks":"Three fresh loads at 1440 with the cluster blocked: a click on the nav button, Cmd+K (then Escape and Cmd+K again once the library is in), and /. Each must show .DocSearch-Modal with focus in .DocSearch-Input, and Escape must return focus to the nav search button.","base":{"pass":true,"value":{"click":true,"clickEscapeReturnsFocus":true,"cmdK":true,"cmdKEscapeReturnsFocus":true,"cmdKAgain":true,"slash":true}},"head":{"pass":true,"value":{"click":true,"clickEscapeReturnsFocus":true,"cmdK":true,"cmdKEscapeReturnsFocus":true,"cmdKAgain":true,"slash":true}},"verdict":"ok","group":"g3-shell-load-reading","code":"context: {\"viewport\":{\"width\":1440,\"height\":900}}\nrun: async ({ page, context, url }) => {\n      await isolate(context)\n      // an Escape pressed in the first few hundred ms after opening is dropped on both builds, so each step settles first\n      const opened = async () => {\n        const ok = await page\n          .waitForFunction(\n            () => document.querySelector('.DocSearch-Modal') && document.activeElement?.matches('.DocSearch-Input'),\n            null,\n            { timeout: 5000 },\n          )\n          .then(\n            () => true,\n            () => false,\n          )\n        await page.waitForTimeout(600)\n        return ok\n      }\n      const escape = async () => {\n        await page.keyboard.press('Escape')\n        await page\n          .waitForFunction(() => !document.querySelector('.DocSearch-Modal'), null, { timeout: 3000 })\n          .catch(() => {})\n        await page.waitForTimeout(300)\n        return page.evaluate(\n          () =>\n            !document.querySelector('.DocSearch-Modal') &&\n            !!document.activeElement?.matches('.VPNav .DocSearch-Button'),\n        )\n      }\n      const value = {}\n      await visit(page, url, '/docs/30.2/api/search.html')\n      await page.click('.VPNav .DocSearch-Button')\n      value.click = await opened()\n      value.clickEscapeReturnsFocus = await escape()\n      await visit(page, url, '/docs/30.2/api/search.html')\n      await page.keyboard.press('Meta+k')\n      value.cmdK = await opened()\n      value.cmdKEscapeReturnsFocus = await escape()\n      await page.keyboard.press('Meta+k')\n      value.cmdKAgain = await opened()\n      await visit(page, url, '/docs/30.2/api/search.html')\n      await page.keyboard.press('/')\n      value.slash = await opened()\n      return { pass: Object.values(value).every(Boolean), value }\n    }","finding":null},{"id":"dark-reload-no-light-flash","title":"A hard reload in dark mode paints dark from the first frame","shas":["1796037a","780722ac"],"kind":"dom","expect":"guard","checks":"With dark saved, reloads search.html at 1440 and reads the html class and the body and html backgrounds on the first animation frame that has a body. The painted colour is the body's when it is opaque, or the html's when the body is transparent. Passes when html has the dark class and that colour is opaque with red, green and blue all under 60.","base":{"pass":true,"value":{"dark":true,"body":"rgb(18, 18, 22)","html":"rgba(0, 0, 0, 0)","painted":"rgb(18, 18, 22)"}},"head":{"pass":true,"value":{"dark":true,"body":"rgb(18, 18, 22)","html":"rgba(0, 0, 0, 0)","painted":"rgb(18, 18, 22)"}},"verdict":"ok","group":"g3-shell-load-reading","code":"context: {\"viewport\":{\"width\":1440,\"height\":900}}\ntheme: 'dark'\nrun: async ({ page, context, url }) => {\n      await isolate(context)\n      await context.addInitScript(() => {\n        const look = () => {\n          if (!document.body) return requestAnimationFrame(look)\n          window.__firstFrame = {\n            dark: document.documentElement.classList.contains('dark'),\n            body: getComputedStyle(document.body).backgroundColor,\n            html: getComputedStyle(document.documentElement).backgroundColor,\n          }\n        }\n        requestAnimationFrame(look)\n      })\n      await visit(page, url, '/docs/30.2/api/search.html')\n      await page.reload()\n      await hydrated(page)\n      const value = await page.evaluate(() => window.__firstFrame)\n      const channels = c => (c.match(/[\\d.]+/g) || []).map(Number)\n      const alpha = c =>\n        c === 'transparent' ? 0 : c.startsWith('rgba(') ? channels(c)[3] : c.startsWith('rgb(') ? 1 : NaN\n      const painted = alpha(value.body) === 1 ? value.body : alpha(value.body) === 0 ? value.html : null\n      const pass = value.dark && !!painted && alpha(painted) === 1 && channels(painted).every(c => c \u003c 60)\n      return { pass, value: { ...value, painted } }\n    }","finding":null},{"id":"hash-landing-holds","title":"A hash link next to an image lands under the bars and stays there when the image arrives late","shas":["cfdf8875","1e5d1ec6"],"kind":"scroll","expect":"guard","checks":"Holds every content image for 2.5s, loads three hash links (search.html#facet-results and magento2#configuration at 1440, astro#final-output at 390), reads the target top at 2s and again at 4.5s and sums content layout shifts after the first read. Passes when the target sits between 40 and 130px from the top, does not move, and nothing in the content shifts.","base":{"pass":true,"value":{"facet-results":{"landed":64,"later":64,"contentClsAfterLanding":0},"configuration":{"landed":64,"later":64,"contentClsAfterLanding":0},"final-output":{"landed":47,"later":47,"contentClsAfterLanding":0}}},"head":{"pass":true,"value":{"facet-results":{"landed":64,"later":64,"contentClsAfterLanding":0},"configuration":{"landed":64,"later":64,"contentClsAfterLanding":0},"final-output":{"landed":47,"later":47,"contentClsAfterLanding":0}}},"verdict":"ok","group":"g3-shell-load-reading","code":"context: {\"viewport\":{\"width\":1440,\"height\":900}}\nrun: async ({ context, url }) => {\n      const value = {}\n      for (const [path, w, h] of [\n        ['/docs/30.2/api/search.html#facet-results', 1440, 900],\n        ['/docs/guide/magento2-search.html#configuration', 1440, 900],\n        ['/docs/guide/astro-search-bar.html#final-output', 390, 844],\n      ]) {\n        const run = await fresh(context, { viewport: { width: w, height: h } }, async ctx => {\n          await isolate(ctx)\n          await ctx.route(/\\/docs\\/images\\/.*\\.(png|svg)$/, async r => {\n            if (!r.request().url().includes('typesense_logo')) await new Promise(done => setTimeout(done, 2500))\n            await r.continue().catch(() => {})\n          })\n          await ctx.addInitScript(SHIFTS)\n        })\n        const id = path.split('#')[1]\n        const top = () =>\n          run.page.evaluate(id => Math.round(document.getElementById(id).getBoundingClientRect().top), id)\n        await run.page.goto(url(path))\n        await run.page.waitForTimeout(2000)\n        const mark = await run.page.evaluate(() => performance.now())\n        const landed = await top()\n        await run.page.waitForTimeout(2500)\n        const later = await top()\n        const shifts = await run.page.evaluate(() => window.__shifts)\n        value[id] = { landed, later, contentClsAfterLanding: clsOf(shifts, e => e.t > mark && e.where.includes('doc')) }\n        await run.ctx.close()\n      }\n      const pass = Object.values(value).every(\n        v => v.landed >= 40 && v.landed \u003c= 130 && v.landed === v.later && v.contentClsAfterLanding \u003c 0.001,\n      )\n      return { pass, value }\n    }","finding":null},{"id":"search-page-dom-size","title":"search.html stays a manageable DOM size","shas":["e1d57f93","103b1f77"],"kind":"dom","expect":"guard","checks":"Counts every element on the hydrated search.html at 1440. HEAD measured 5,345 and base 5,065. Passes under 5,600, which is HEAD plus about 5%.","base":{"pass":true,"value":{"elements":5065}},"head":{"pass":true,"value":{"elements":5345}},"verdict":"ok","group":"g3-shell-load-reading","code":"context: {\"viewport\":{\"width\":1440,\"height\":900}}\nrun: async ({ page, context, url }) => {\n      await isolate(context)\n      await visit(page, url, '/docs/30.2/api/search.html')\n      await page.waitForTimeout(1000)\n      const elements = await page.evaluate(() => document.getElementsByTagName('*').length)\n      return { pass: elements \u003c 5600, value: { elements } }\n    }","finding":null}],"gateGroups":[{"id":"g1-tabs-controls","title":"Code tabs and in-page controls","blurb":"Handoffs 01 and 02. Tab semantics and keyboard, the copy menu, image zoom, copy announcements and the version picker."},{"id":"g2-contrast-keyboard","title":"Contrast, colour tokens and keyboard shell","blurb":"Handoffs 03 and 04. Contrast ratios, token cleanups that must not change anything, dark surfaces, and keyboard paths through the nav, sidebar and skip link."},{"id":"g3-shell-load-reading","title":"Shell stability, loading and reading","blurb":"Handoffs 05 to 08. Server-rendered chrome, layout shift, fonts, lazy loading, copy by fetch, search, the home, and reading changes."}],"calls":[{"id":"found-sidebar-ssr","group":"Found while building this review","shas":["d24ce632","04f199ee"],"see":"gate-sidebar-server-matches-hydrated","title":"Guide pages inside a collapsed group jump when the sidebar hydrates","detail":"The server renders Cookbooks, Walk-Throughs and Reference Implementations collapsed even on a page inside them (the HTML says 'collapsed has-active'). VitePress opens the group on the client, so the sidebar jumps: CLS 0.040 on the LangChain guide and 0.028 on Semantic Search, 0 on base. With JavaScript off the current page is hidden. Every page in those three groups is affected. The shadowed VPSidebarItem could start a group open on the server when it holds the current page. Handoff 08 doesn't list this as accepted."},{"id":"found-copy-attrs","group":"Found while building this review","shas":["1e5d1ec6"],"title":"Copied markdown and llms-full.txt now carry image size braces","detail":"The 17 images sized for lazy loading are written as ![…](…){width=2346 height=1792}. That syntax now appears in Copy Markdown, the raw .md files (59 built files with language variants) and llms-full.txt (22 places). Otherwise the copied text matches base byte for byte."},{"id":"found-gray-token","group":"Found while building this review","shas":["e3d83063"],"see":"L2","title":"In light code, a gray token sits at the keyword's lightness","detail":"The colour-blind stepping spaced keywords, strings and constants apart in lightness. A plain gray token (rgb(99,99,112), 325 spans on search.html) sits at OKLCH lightness 0.504 against the green keyword's 0.499. Readers who tell tokens apart by lightness alone may not separate the two. The gate skips low-chroma tokens, so it can't see this."},{"id":"call-prose-cap","group":"Design calls to accept","shas":["085e9425","84032a0f"],"see":"L1","title":"Prose stops at 30rem while code and tables run full width","detail":"At 1440 paragraphs end about 200px short of the code blocks, tables and callouts beside them. Approved as G2 (a 60ch cap, shipped as 30rem so both fonts match). Decide whether the ragged right edge reads as intended. The cap also narrows the home page's version list."},{"id":"call-active-sidebar","group":"Design calls to accept","shas":["84ecbfdd"],"see":"L4","title":"The current sidebar page is no longer bold","detail":"Long titles stopped rewrapping, so the current page is marked only by brand text and the lime pill. In light the pill is 1.05:1 against the page. Decide whether the current page is still obvious. The phone outline dropdown's active row is still semibold."},{"id":"call-dark-search-label","group":"Design calls to accept","shas":["de20e790"],"see":"L1","title":"The dark search button label is dimmer","detail":"The DocSearch button now uses the site grays, with 'Search' at gray 11. In dark it reads clearly dimmer than before. Approved as G16."},{"id":"call-code-palette","group":"Design calls to accept","shas":["5e30f0af","e3d83063"],"see":"L2","title":"Code is coloured from the site palette, not GitHub's","detail":"Every token passes AA and the token lightness is stepped apart for colour-blind readers. Fanis checked it himself. Nobody has tested long 14px reading with it yet."},{"id":"call-truncation","group":"Design calls to accept","shas":["032fc436","fc63b9ee","e654bb5b"],"see":"L6","title":"Long titles truncate in the pinned bar and the phone breadcrumb","detail":"The pinned section bar holds one line at every width and ends long titles in an ellipsis. At 360 the phone breadcrumb's page title can shrink to a stub like 'Sea…', because the version and section never truncate (G12). The full title stays in the heading and the outline."},{"id":"call-param-hash","group":"Design calls to accept","shas":["e1d57f93","2dc5f5f0"],"see":"L6","title":"Each parameter gets a # link and a Tab stop","detail":"The # hit area is 44px tall but 16px wide on desktop and 20px on phones, so it doesn't cover the name. Every parameter adds one Tab stop, as headings do. Search hits could start landing on these ids after the next scrape. Nobody has checked that yet."},{"id":"call-balance","group":"Design calls to accept","shas":["8da4e8c6"],"see":"L4","title":"Sidebar and outline labels use text-balance","detail":"Balance removes one-word last lines, but a wrapped label can look narrower than its neighbours. The handoff suggested text-pretty."},{"id":"call-faqs-widget","group":"Design calls to accept","shas":["1e5d1ec6"],"title":"The faqs widget image stays 958px tall","detail":"It was meant to show at 400px, as it did on the old VuePress site. Sizing it for lazy loading kept today's 958px. Restoring 400px is a visible change left for Fanis."},{"id":"call-zoom-ring","group":"Design calls to accept","shas":["db6f668e"],"see":"W2","title":"A focused zoomable image shows the browser's default ring","detail":"Images are now keyboard stops, but .medium-zoom-image has no focus style. Chrome draws its 1px blue outline, not the site's lime ring. On the high-availability diagram it blends into the image's own blue frame. Found while writing the gates."},{"id":"call-tabs-keys","group":"Behaviour calls to accept","shas":["5ed71446","ba82008a","9f5824f1"],"see":"W1","title":"Code tabs are hand-built, without Home and End","detail":"reka-ui Tabs cost 83 to 133ms per synced click at 4x CPU, so the tab list is hand-built. Arrow keys move and select. Home and End still scroll the page. A strip with one language is a plain label but keeps role=tab, so a screen reader reads it as 'tab, 1 of 1'."},{"id":"call-zoom-modal","group":"Behaviour calls to accept","shas":["db6f668e","529af28e","0e6dbad4"],"see":"W2","title":"Image zoom behaves like a modal","detail":"Focus moves into the zoomed image on every open, mouse included, and Space closes it. Closing by overlay click, wheel or resize leaves focus on the page body. After a click close, Space can reopen an image that has since scrolled off screen."},{"id":"call-404-escape","group":"Behaviour calls to accept","shas":["f93c0c38"],"see":"W9","title":"Escape from search opened on the 404 lands on the nav search button","detail":"The DocSearch fork always refocuses its own button. Returning focus to the 404 link needs a fork change."},{"id":"call-version-v","group":"Behaviour calls to accept","shas":["ba4383af"],"see":"W3","title":"Typing '29' finds v29 in the version picker, typing 'v29' doesn't","detail":"Reka matches one text value per row, and 'v' alone matched every row, so the bare number won."},{"id":"call-outline-hold","group":"Behaviour calls to accept","shas":["6d3748cf"],"see":"W7","title":"The phone nav can't be revealed while the outline panel is open","detail":"The nav holds still while the panel is open, so scrolling up doesn't bring it back until the panel closes."},{"id":"call-lazy-search","group":"Behaviour calls to accept","shas":["780722ac"],"see":"W9","title":"DocSearch loads on first use","detail":"If the chunk fails to load, search stays off in that tab until a reload. Off Apple platforms the server-rendered ⌘ becomes Ctrl after mount, a 9px shift. DocSearch's CSS still ships in the render-blocking stylesheet, about 40KB."},{"id":"call-copy-fetch","group":"Behaviour calls to accept","shas":["34a2ed2b","370843e7"],"title":"Copy Markdown fetches the page's .md on click","detail":"Pages no longer embed their markdown. The clipboard write waits on the fetch through a promise-valued ClipboardItem, which older Firefox doesn't support, so copy fails there. Production sends no Cache-Control on .md files."},{"id":"call-font-fallback","group":"Behaviour calls to accept","shas":["1796037a"],"title":"Self-hosted fonts fall back to a resized Arial","detail":"On a system without Arial (many Linux setups) the old fallback stack returns and so does the swap shift. Only the latin subset ships, and italic isn't preloaded."},{"id":"hand-firefox-safari","group":"Check by hand","shas":["5ed71446","9a961159","34a2ed2b","1796037a"],"title":"Try it once in Safari and Firefox","detail":"Every capture and gate ran in headless Chromium. Worth one pass in other engines: arrow keys in a code tab strip that overflows, Copy Markdown (Safari needs the click gesture, older Firefox lacks promise-valued ClipboardItem), and the font swap on a cold load."},{"id":"hand-phone-tabs","group":"Check by hand","shas":["5ed71446","d74ea978"],"title":"On a real phone, picking a tab with the arrow keys shouldn't move the nav","detail":"With a hardware keyboard on a phone or tablet, arrow keys in a tab strip shouldn't hide or reveal the phone nav. The code checks defaultPrevented, but no gate covers it."},{"id":"hand-version-fades","group":"Check by hand","shas":["547c3e8d"],"title":"The version list's edge fades follow its scroll","detail":"Open the version picker, scroll the list, and press End and Home. The top and bottom fades should show only when there's more list in that direction."},{"id":"hand-copy-status","group":"Check by hand","shas":["68b077cd"],"title":"Copy announcements stay out of the outline and search","detail":"The new 'Code copied' and 'Section copied' status text shouldn't show up in the outline, the pinned bars, or the scraped search records after the next scrape."},{"id":"open-shiki","group":"Follow-ups that aren't in this branch","shas":["5e30f0af"],"title":"shiki is pinned to exactly 2.5.0 in dependencies","detail":"Handoff 03 wants it as a dev dependency with a caret: bun add -d shiki@^2.5.0."},{"id":"open-popover-768","group":"Follow-ups that aren't in this branch","shas":["dc9ac5ca"],"title":"The copy popover is still misaligned from 768px up","detail":"At 768 it starts at 24px against the group's 40px. From 1024 it hangs 65px into the sidebar column. On short screens it can open above the top edge."},{"id":"open-dark-dropdown","group":"Follow-ups that aren't in this branch","shas":["fe94d5f1"],"title":"The phone 'On this page' dropdown is still gray 2 in dark","detail":"Every other floating panel moved to gray 3. It's a one-line fix, recorded in handoff 03."},{"id":"open-tailwind-glob","group":"Follow-ups that aren't in this branch","shas":["f5b32529"],"title":"Tailwind scans the build output","detail":"The content glob includes .vitepress/dist and cache, which leaks about 99 stale rules into production CSS and slows compiles from 2s to 21s."},{"id":"open-skip-link","group":"Follow-ups that aren't in this branch","shas":["64ec5980"],"title":"Shift+Tab onto the skip link scrolls to the top","detail":"This was already broken on master. Making the skip link fixed in the new shadow component would fix it."},{"id":"open-scraper","group":"Follow-ups that aren't in this branch","shas":["8c75edf5","2dc5f5f0"],"title":"The scraper config change hasn't seen a real scrape","detail":"docsearch.config.js now leaves tab lists and tab panels out of records. This was checked by emulating the scraper only. The new parameter ids will also show up in the next scrape."},{"id":"open-vitepress2","group":"Follow-ups that aren't in this branch","shas":["4bcb92ad","e5046597","f01a81ed","08c5cbf5"],"title":"Four VitePress components are now local copies","detail":"The outline dropdown, sidebar item, sidebar transition and skip link are Tailwind ports pinned to VitePress 1.6.4. Recheck them when VitePress 2 lands."},{"id":"open-512","group":"Follow-ups that aren't in this branch","shas":["5de0bfd3"],"title":"One commit belongs to PR #512","detail":"'set sidebar links to regular weight' is Fanis's fix for the #512 review. It was cherry-picked onto bump-font-size and drops out when this branch is rebased."}],"read":[{"sha":"80cdff98","subject":"build(config): drive tailwind dark variants from the theme toggle","summary":"Nothing visible changes. A future Tailwind `dark:` class will follow the site's theme toggle instead of the OS setting. Adds `darkMode: 'selector'` and a one-line comment to tailwind.config.js. 'selector' instead of 'class' gives the same behaviour without the added specificity. None. No `dark:` utility exists in the source on this commit or on HEAD, so the compiled CSS is the same."},{"sha":"f41a83dc","subject":"style(nav): reword the has-sidebar comment","summary":"Nothing visible changes. A template comment is reworded. Rewords the HTML comment above the VPNavBar has-sidebar binding in VPNav.vue. None. Vue strips template comments from production builds."},{"sha":"cacb1126","subject":"refactor(theme): check for page markdown once in the copy helper","summary":"Nothing visible changes. The missing-markdown check moves into the shared copy helper. Removes the markdownUrl guard from MarkdownActions.copyMarkdown and has copyPageMarkdown throw when page.markdownUrl is missing, dropping the non-null assertion. None. A page without markdown still lands in copyMarkdown's catch, because the throw happens inside the awaited call."},{"sha":"984240fa","subject":"style(theme): reword the fallback font comment","summary":"Nothing visible changes. A CSS comment is reworded. Splits the fallback @font-face comment in style.css into two sentences to drop a ', so' chain. None. Comments are stripped from the built CSS."},{"sha":"e69af439","subject":"docs: write hand-typed callout titles in sentence case","summary":"Callout titles that authors typed in capitals, such as NOTE and IMPORTANT, now read in sentence case to match the new default labels. 98 title lines in every version and the guide. NOTE to Note (64), IMPORTANT NOTE & TIP to Important note & tip (18), IMPORTANT to Important (14), UPDATE to Update (2). No body text changes. Only those 98 callout titles render differently. A grep of HEAD content finds no all-capitals callout title left."}],"fork":[{"sha":"3bbd9a79","subject":"fix(react): keep the empty dropdown closed while the first search loads","branch":"fix/keep-empty-dropdown-closed","plain":"In the fork, a first search on a slow network keeps the results panel closed until hits arrive instead of opening a blank 600px panel, and it can only be seen by serving a fork build of branch fix/keep-empty-dropdown-closed into the site until a release ships it."},{"sha":"7724198f","subject":"fix(react): expose the search modal as a modal dialog","branch":"fix/modal-dialog-semantics","plain":"In the fork, screen readers meet the search modal as a modal dialog named by the search label instead of a 'button', and it only reaches the site through a fork build of fix/modal-dialog-semantics or a release."},{"sha":"3671e4e4","subject":"docs(react): say the dialog takes focus in the keep-input-focus comments","branch":"fix/modal-dialog-semantics","plain":"Comment and test wording only in the fork, on branch fix/modal-dialog-semantics, and nothing renders differently."},{"sha":"bd35c3a7","subject":"fix(css): fade in with ease-out and transition only what the keys animate","branch":"fix/css-motion-easing","plain":"In the fork, the search key caps transition only transform and box-shadow and the modal's fades use ease-out instead of ease-in, which nobody can see in the site until a release."},{"sha":"cd24a95a","subject":"fix(css): show recent search actions on every row on touch screens","branch":"fix/touch-recent-search-actions","plain":"In the fork, every recent-search row on a touch screen shows its Pin and Remove buttons instead of only the first row, and the site only gets it with a release."},{"sha":"5da90a85","subject":"fix(css): fit the modal inside short windows","branch":"fix/css-motion-easing, fix/keep-empty-dropdown-closed, fix/modal-dialog-semantics, fix/modal-viewport-height, fix/touch-recent-search-actions, main-typesense","plain":"Already merged to the fork main (PR #55) but not released, it caps the modal at the window height minus 120px so the footer and the selected hit stay on screen in short windows, and 5.0.2-4 in both previews predates it."},{"sha":"3a79bf10","subject":"fix(css): make error screen spacing consistent & use accent color for docsearch help link","branch":"fix/css-motion-easing, fix/hit-select-icon, fix/keep-empty-dropdown-closed, fix/modal-dialog-semantics, fix/modal-keep-input-focus, fix/modal-viewport-height, fix/touch-recent-search-actions, main-typesense","plain":"Already on the fork main but not released, it gives the search error screen the same 2em top space and gap as No results and colours the help link with the accent, and 5.0.2-4 in both previews predates it."}],"forkNote":"Handoff 07 fixed DocSearch bugs in the typesense-docsearch.js fork, not in this branch. The site still installs 5.0.2-4 from npm, so neither build on this page shows them. Review them as fork PRs once the branches are pushed. They reach the site after a fork release and a dependency bump.","rerun":[{"title":"Build the branch and preview it","text":"From docs-site. A build needs about 16GB and takes about 2.5 minutes. Without bun or Node, `nix develop ./docs-site` from the repo root gives you both.","cmd":"bun run build && bun run preview --port 4173"},{"title":"Build the base in a shared clone","text":"A shared clone keeps your checkout untouched and reuses its node_modules.","cmd":"git clone --shared --no-checkout \u003crepo> before && cd before && git checkout 6e776ca3\nln -s \u003crepo>/docs-site/node_modules docs-site/node_modules\ncd docs-site && bun run build && bun run preview --port 4174"},{"title":"Run the gates","text":"From review/. Each gate opens a fresh context on both builds and prints its verdict.","cmd":"bun install && bunx playwright install chromium\nnode run.js gates/g1-tabs-controls.js gates/g2-contrast-keyboard.js gates/g3-shell-load-reading.js gates/g3-shell-load-reading-anchors.js"},{"title":"run.js","text":"The whole runner.","cmd":"// Runs gate files against the base and HEAD production previews.\n// node run.js gates/g1-tabs-controls.js [more files] [--only=id,id] [--base=URL] [--head=URL]\nconst { chromium } = require('playwright')\nconst fs = require('fs')\nconst path = require('path')\n\nconst arg = name => (process.argv.find(a => a.startsWith(`--${name}=`)) || '').split('=').slice(1).join('=')\nconst BUILDS = { base: arg('base') || 'http://localhost:4174', head: arg('head') || 'http://localhost:4173' }\nconst only = arg('only').split(',').filter(Boolean)\nconst files = process.argv.slice(2).filter(a => !a.startsWith('--'))\n\nconst verdict = (expect, base, head) => {\n  if (expect === 'flip') return !base.pass && head.pass ? 'ok' : 'check'\n  if (expect === 'guard') return base.pass && head.pass ? 'ok' : 'check'\n  return head.pass ? 'ok' : 'check'\n}\n\nasync function runOne(browser, gate, build) {\n  const context = await browser.newContext({ viewport: { width: 1280, height: 800 }, ...gate.context })\n  if (gate.theme) await context.addInitScript(t => localStorage.setItem('vitepress-theme-appearance', t), gate.theme)\n  const page = await context.newPage()\n  const url = p => BUILDS[build] + p\n  const timer = new Promise((_, reject) => setTimeout(() => reject(new Error('timed out after 60s')), 60000))\n  try {\n    const r = await Promise.race([gate.run({ page, context, url, build }), timer])\n    return { pass: !!r.pass, value: r.value ?? null }\n  } catch (e) {\n    return {\n      pass: false,\n      value: null,\n      error: String(e.message || e)\n        .split('\\n')[0]\n        .slice(0, 300),\n    }\n  } finally {\n    await context.close()\n  }\n}\n\n;(async () => {\n  const browser = await chromium.launch()\n  await Promise.all(\n    files.map(async file => {\n      const gates = require(path.resolve(file)).filter(g => !only.length || only.includes(g.id))\n      const results = []\n      for (const gate of gates) {\n        const base = await runOne(browser, gate, 'base')\n        const head = await runOne(browser, gate, 'head')\n        const { run, context, theme, ...meta } = gate\n        results.push({ ...meta, base, head, verdict: verdict(gate.expect, base, head) })\n        console.log(\n          `${results.at(-1).verdict.padEnd(5)} ${gate.id}  base=${JSON.stringify(\n            base.value ?? base.error,\n          )}  head=${JSON.stringify(head.value ?? head.error)}`,\n        )\n      }\n      if (!only.length)\n        fs.writeFileSync(\n          path.join(__dirname, 'results', path.basename(file, '.js') + '.json'),\n          JSON.stringify(results, null, 2),\n        )\n    }),\n  )\n  await browser.close()\n})()\n"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent)
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag)
  Object.entries(attrs).forEach(([k, v]) => {
    if (v == null || v === false) return
    if (k === 'class') el.className = v
    else if (k === 'text') el.textContent = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  })
  kids.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)))
  return el
}
const ledgerBySha = Object.fromEntries(D.ledger.map(e => [e.sha, e]))
const units = []
const signSlots = []

const shaChip = sha => {
  const e = ledgerBySha[sha]
  const el = $('code', { class: 'sha', title: e ? `${e.subject} (click to copy)` : 'click to copy', tabindex: 0 }, sha)
  const copy = () => {
    navigator.clipboard?.writeText(sha).then(() => { el.textContent = 'copied'; setTimeout(() => { el.textContent = sha }, 900) }).catch(() => getSelection().selectAllChildren(el))
  }
  el.addEventListener('click', copy)
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter') copy() })
  return el
}
const gatesFor = sha => {
  const gs = D.gates.filter(g => g.shas.includes(sha))
  return gs.length ? [' Checked by ', ...gs.flatMap((g, i) => [i ? ', ' : '', $('a', { href: `#gate-${g.id}`, text: g.title })]), '.'] : []
}
const signSlot = id => {
  units.push(id)
  const box = $('div', { class: 'sign', 'data-id': id, hidden: true })
  signSlots.push(box)
  return box
}

/* ---------- intro ---------- */
const counts = {
  look: D.stops.reduce((n, s) => n + s.crops.length, 0),
  watch: D.walks.length,
  gates: D.gates.length,
  gatesCheck: D.gates.filter(g => g.verdict !== 'ok').length,
  calls: D.calls.length,
  read: D.read.length,
}
const app = document.getElementById('app')
app.append($('header', { class: 'intro' },
  $('div', { class: 'eyebrow', text: 'typesense/website · docs-ui-review-fixes' }),
  $('h1', { text: 'Docs UI branch review' }),
  $('p', { class: 'lead', text: `${D.meta.commits} commits from the docs UI audit, on top of the font bump. Every commit is reviewed in exactly one of the passes below. Visible changes are screenshot pairs, interactions are short clips, and changes you can't see are automated gates run against both builds.` }),
  $('div', { class: 'facts' },
    $('span', {}, 'Before ', $('b', { class: 'mono', text: D.meta.base }), ` ${D.meta.baseLabel}`),
    $('span', {}, 'After ', $('b', { class: 'mono', text: D.meta.head }), ` ${D.meta.headLabel}`),
    $('span', {}, $('b', { text: String(D.meta.commits) }), ' commits in 8 handoffs'),
    $('span', {}, $('b', { text: String(D.fork.length) }), ' DocSearch fork commits, reviewed separately'),
    $('span', {}, 'Captured ', $('b', { text: D.meta.captured }))),
  $('div', { class: 'passes' },
    passCard('look', 'Look', counts.look, 'before and after pairs'),
    passCard('watch', 'Watch', counts.watch, 'keyboard and scroll clips'),
    passCard('gates', 'Gates', counts.gates, counts.gatesCheck ? `${counts.gatesCheck} need a look` : 'all pass as expected'),
    passCard('calls', 'Calls', counts.calls, 'decisions and follow-ups'),
    passCard('read', 'Read', counts.read, 'diff-only commits')),
  $('p', { class: 'notice', id: 'signoff-note', text: 'Sign-off buttons appear when this page is opened signed in to claude.ai. Each reviewer marks a unit “Looks right” or “Flag” with a note, and everyone sees everyone’s marks.' })))

function passCard(id, k, n, d) {
  return $('a', { class: 'pass', href: `#${id}` }, $('span', { class: 'k', text: k }), $('span', { class: 'n', text: String(n) }), $('span', { class: 'd', text: d }), $('span', { class: 'mine', 'data-pass': id }))
}
function section(id, title, blurb, ...extra) {
  const s = $('section', { class: 'pass-section', id }, $('div', { class: 'sec-head' }, $('div', {}, $('h2', { text: title }), $('p', { text: blurb })), ...extra))
  app.append(s)
  return s
}

/* ---------- look ---------- */
let compareMode = 'side'
try { compareMode = localStorage.getItem('compare') || 'side' } catch {}
const modeSeg = $('div', { class: 'seg', role: 'group', 'aria-label': 'Compare mode' },
  $('button', { 'aria-pressed': String(compareMode === 'side'), 'data-mode': 'side', text: 'Side by side' }),
  $('button', { 'aria-pressed': String(compareMode === 'flip'), 'data-mode': 'flip', text: 'Flip' }))
modeSeg.addEventListener('click', e => {
  const m = e.target.dataset.mode
  if (!m) return
  compareMode = m
  try { localStorage.setItem('compare', m) } catch {}
  modeSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)))
  document.querySelectorAll('.pair').forEach(p => p._render(m))
})
const look = section('look', 'Look', 'Each pair is the same page, state and crop on both builds. Flip mode shows one image at a time so small changes jump out. Click an image to flip it.', modeSeg)

D.stops.forEach(stop => {
  const s = $('div', { class: 'stop', id: stop.id }, $('h3', {}, stop.title, $('span', { class: 'where', text: `${stop.page} · ${stop.viewport}` })))
  stop.crops.forEach(crop => {
    const id = `look:${stop.id}/${crop.key}`
    const pair = $('div', { class: 'pair' })
    let showing = 'head'
    const img = (which) => $('img', { src: crop[which], alt: `${crop.title}, ${which === 'base' ? 'before' : 'after'}`, loading: 'lazy' })
    pair._render = (mode) => {
      pair.replaceChildren()
      pair.classList.toggle('flip', mode === 'flip')
      if (mode === 'side') {
        pair.append(
          $('figure', {}, $('figcaption', { class: 'cap-before', text: 'Before' }), $('button', { class: 'shot', type: 'button', 'aria-label': 'Flip this pair', onclick: () => pair._render('flip') }, img('base'))),
          $('figure', {}, $('figcaption', { class: 'cap-after', text: 'After' }), $('button', { class: 'shot', type: 'button', 'aria-label': 'Flip this pair', onclick: () => pair._render('flip') }, img('head'))))
      } else {
        const label = $('span', { class: `flip-label ${showing === 'base' ? 'cap-before' : 'cap-after'}`, text: showing === 'base' ? 'Before' : 'After' })
        const shot = $('button', { class: 'shot', type: 'button', 'aria-label': 'Show the other build', onclick: () => { showing = showing === 'base' ? 'head' : 'base'; pair._render('flip'); pair.querySelector('.shot').focus() } }, img(showing))
        pair.append($('div', { class: 'flip-box' }, $('div', { class: 'unit-head' }, label, $('span', { class: 'flip-hint', text: 'Click or press Enter to switch' })), shot))
      }
    }
    pair._render(compareMode)
    s.append($('article', { class: 'unit', id: `${stop.id}-${crop.key}` },
      $('div', { class: 'unit-head' }, $('h4', { text: crop.title }), crop.theme ? $('span', { class: 'chip', text: crop.theme }) : null, crop.viewport ? $('span', { class: 'chip', text: crop.viewport }) : null),
      pair,
      $('ul', { class: 'items' }, crop.items.map(it => $('li', {}, shaChip(it.sha), it.seen ? $('span', { text: it.look_for }) : $('span', { class: 'gone' }, it.look_for || 'Not visible in this pair.', ...gatesFor(it.sha))))),
      crop.note ? $('p', { class: 'note', text: crop.note }) : null,
      signSlot(id)))
  })
  look.append(s)
})

/* ---------- watch ---------- */
const watch = section('watch', 'Watch', 'Each clip runs the same steps on both builds. The key badge in the corner shows what was pressed. Play both to compare them in step.')
D.walks.forEach(w => {
  const vids = $('div', { class: 'vids' })
  const pairs = w.clips.map(c => [
    $('figure', {}, $('figcaption', { class: 'cap-before', text: `Before${c.label ? ' · ' + c.label : ''}` }), $('video', { src: c.base, controls: true, muted: true, playsinline: true, preload: 'metadata' })),
    $('figure', {}, $('figcaption', { class: 'cap-after', text: `After${c.label ? ' · ' + c.label : ''}` }), $('video', { src: c.head, controls: true, muted: true, playsinline: true, preload: 'metadata' }))])
  pairs.flat().forEach(f => vids.append(f))
  const playBoth = $('button', { class: 'btn', type: 'button', text: 'Play both', onclick: () => { vids.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play().catch(() => {}) }) } })
  watch.append($('article', { class: 'unit', id: w.id },
    $('div', { class: 'unit-head' }, $('h4', { text: w.title }), $('span', { class: 'chip', text: w.viewport }), playBoth),
    $('div', { class: 'meta-row' }, $('span', { class: 'mono', text: w.page }), ...w.shas.map(shaChip)),
    vids,
    $('ol', { class: 'steps' }, w.steps.map(t => $('li', { text: t }))),
    $('div', { class: 'expect' }, $('div', {}, $('b', { text: 'After' }), w.expect_head), $('div', {}, $('b', { text: 'Before' }), w.expect_base)),
    w.note ? $('p', { class: 'note', text: w.note }) : null,
    signSlot(`watch:${w.id}`)))
})

/* ---------- gates ---------- */
const expectText = { flip: 'Fails before, passes after', guard: 'Must pass on both', head: 'Checked on the branch only' }
let gateFilter = 'all'
const gateSeg = $('div', { class: 'seg', role: 'group', 'aria-label': 'Show gates' },
  $('button', { 'aria-pressed': 'true', 'data-f': 'all', text: 'All' }),
  $('button', { 'aria-pressed': 'false', 'data-f': 'check', text: `Need a look (${counts.gatesCheck})` }))
const gates = section('gates', 'Gates', 'Changes you can’t judge by eye: ARIA, focus order, server-rendered markup, layout shift, contrast ratios, network requests. Each gate runs on both builds. Review the check itself: does it test the claim?', gateSeg)
const okCount = D.gates.filter(g => g.verdict === 'ok').length
gates.append($('div', { class: 'gate-summary' },
  $('span', { class: 'chip ok', text: `${okCount} as expected` }),
  counts.gatesCheck ? $('span', { class: 'chip check', text: `${counts.gatesCheck} need a look` }) : null,
  $('span', { class: 'chip', text: `${D.gates.filter(g => g.expect === 'flip').length} flip · ${D.gates.filter(g => g.expect === 'guard').length} guard` }),
  $('a', { href: '#rerun', text: 'Run them yourself' })))
D.gateGroups.forEach(gr => {
  const box = $('div', { class: 'gate-group' }, $('h3', { text: gr.title }), $('p', { text: gr.blurb }))
  D.gates.filter(g => g.group === gr.id).forEach(g => {
    const val = (which) => {
      const r = g[which]
      const body = r.error ? `error: ${r.error}` : JSON.stringify(r.value, null, 1)?.replace(/\n\s*/g, ' ') ?? 'null'
      return $('div', { class: `val ${r.pass ? 'pass' : 'fail'}` }, $('b', { text: which === 'base' ? 'Before' : 'After' }), body)
    }
    box.append($('article', { class: 'unit gate', id: `gate-${g.id}`, 'data-verdict': g.verdict },
      $('div', { class: 'unit-head' }, $('h4', { text: g.title }), $('span', { class: 'chip', text: expectText[g.expect] || g.expect }), $('span', { class: `chip ${g.verdict}`, text: g.verdict === 'ok' ? 'as expected' : 'needs a look' })),
      $('div', { class: 'meta-row' }, $('span', { class: 'chip', text: g.kind }), ...g.shas.map(shaChip)),
      $('p', { class: 'checks', text: g.checks }),
      g.finding ? $('p', { class: 'note', text: g.finding }) : null,
      $('div', { class: 'vals' }, val('base'), val('head')),
      g.code ? $('details', {}, $('summary', { text: 'Gate code' }), $('pre', {}, $('code', { text: g.code }))) : null,
      signSlot(`gate:${g.id}`)))
  })
  gates.append(box)
})
gateSeg.addEventListener('click', e => {
  const f = e.target.dataset.f
  if (!f) return
  gateFilter = f
  gateSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)))
  document.querySelectorAll('.gate').forEach(g => { g.hidden = f === 'check' && g.dataset.verdict === 'ok' })
})

/* ---------- calls ---------- */
const calls = section('calls', 'Calls', 'Decisions a person has to accept, and known gaps left for later. Gates and pairs can show what changed, but not whether it’s the right trade.')
const groups = [...new Set(D.calls.map(c => c.group))]
groups.forEach(gname => {
  const box = $('div', { class: 'call-group' }, $('h3', { text: gname }))
  D.calls.filter(c => c.group === gname).forEach(c => box.append($('article', { class: 'unit call', id: c.id },
    $('div', { class: 'unit-head' }, $('h4', { text: c.title })),
    $('p', { text: c.detail }),
    $('div', { class: 'meta-row' }, ...c.shas.map(shaChip), c.see ? $('a', { href: `#${c.see}`, text: 'See it' }) : null),
    signSlot(`call:${c.id}`))))
  calls.append(box)
})

/* ---------- read ---------- */
const read = section('read', 'Read', 'Commits with nothing to see or measure, or text edits across many files. Read the diff.')
D.read.forEach(r => read.append($('article', { class: 'unit', id: `read-${r.sha}` },
  $('div', { class: 'unit-head' }, shaChip(r.sha), $('h4', { text: r.subject })),
  $('p', { class: 'note', text: r.summary }),
  $('div', { class: 'cmd' }, $('pre', {}, $('code', { text: `git show ${r.sha}` }))),
  signSlot(`read:${r.sha}`))))

/* ---------- fork ---------- */
const fork = section('fork', 'DocSearch fork', D.forkNote)
fork.append($('div', { class: 'table-wrap' }, $('table', {},
  $('thead', {}, $('tr', {}, ['Commit', 'Where', 'Change', 'How to review'].map(h => $('th', { text: h })))),
  $('tbody', {}, D.fork.map(f => $('tr', {}, $('td', {}, shaChip(f.sha)), $('td', { class: 'mono', text: f.branch }), $('td', { text: f.subject }), $('td', { class: 'plain', text: f.plain })))))))

/* ---------- ledger ---------- */
const where = e => {
  const out = []
  D.stops.forEach(s => s.crops.forEach(c => { if (c.items.some(i => i.sha === e.sha)) out.push([`${s.id}-${c.key}`, `Look ${s.id}`]) }))
  D.walks.forEach(w => { if (w.shas.includes(e.sha)) out.push([w.id, `Watch ${w.id}`]) })
  D.gates.forEach(g => { if (g.shas.includes(e.sha)) out.push([`gate-${g.id}`, 'Gate']) })
  D.read.forEach(r => { if (r.sha === e.sha) out.push([`read-${r.sha}`, 'Read']) })
  const seen = new Set()
  return out.filter(([h]) => !seen.has(h) && seen.add(h))
}
const ledger = section('ledger', 'Ledger', 'All commits, oldest first, with the pass that covers each one. Use it to confirm nothing was skipped, or to find one commit.')
const q = $('input', { type: 'search', id: 'ledger-q', placeholder: 'Filter by sha, subject or text', 'aria-label': 'Filter commits' })
const hsel = $('select', { id: 'ledger-h', 'aria-label': 'Handoff' }, $('option', { value: '', text: 'All handoffs' }), ['01', '02', '03', '04', '05', '06', '07', '08'].map(h => $('option', { value: h, text: `Handoff ${h}` })))
const msel = $('select', { id: 'ledger-m', 'aria-label': 'Method' }, $('option', { value: '', text: 'Any pass' }), ['LOOK', 'TRY', 'GATE', 'DIFF'].map(m => $('option', { value: m, text: m })))
ledger.append($('div', { class: 'filters' }, q, hsel, msel))
const tbody = $('tbody')
ledger.append($('div', { class: 'table-wrap' }, $('table', {}, $('thead', {}, $('tr', {}, ['Commit', 'Handoff', 'Subject', 'What changes', 'Reviewed in'].map(h => $('th', { text: h })))), tbody)))
const rows = D.ledger.filter(e => e.handoff !== '07-fork').map(e => {
  const links = where(e)
  const tr = $('tr', { class: e.superseded_by ? 'superseded' : null },
    $('td', {}, shaChip(e.sha)),
    $('td', { text: e.handoff }),
    $('td', { text: e.subject }),
    $('td', { class: 'plain' }, e.plain, e.superseded_by ? $('div', { class: 'note' }, 'Reworked later by ', shaChip(e.superseded_by), '. Review the later one.') : null),
    $('td', {}, links.length ? links.map(([h, t]) => $('div', {}, $('a', { href: `#${h}`, text: t }))) : $('span', { class: 'note', text: e.superseded_by ? 'via the later commit' : '—' })))
  tr._text = `${e.sha} ${e.subject} ${e.plain}`.toLowerCase()
  tr._h = e.handoff
  tr._m = [e.method, e.secondary]
  tbody.append(tr)
  return tr
})
const filt = () => {
  const t = q.value.toLowerCase().trim()
  rows.forEach(r => { r.hidden = (t && !r._text.includes(t)) || (hsel.value && r._h !== hsel.value) || (msel.value && !r._m.includes(msel.value)) })
}
;[q, hsel, msel].forEach(el => el.addEventListener('input', filt))

const rerun = section('rerun', 'Run it yourself', 'Everything on this page came from two local production builds and headless Chromium. To reproduce it:')
D.rerun.forEach(step => rerun.append($('div', { class: 'unit' }, $('h4', { text: step.title }), step.text ? $('p', { class: 'note', text: step.text }) : null, $('div', { class: 'cmd' }, $('pre', {}, $('code', { text: step.cmd }))))))
app.append($('footer', { text: `Built ${D.meta.captured} from ${D.meta.head}. Screenshots and clips are local production builds in headless Chromium, so fonts match the site but scrollbars and GPU effects may differ from a real browser.` }))

/* ---------- sign-off ---------- */
const passOf = id => ({ look: 'look', watch: 'watch', gate: 'gates', call: 'calls', read: 'read' })[id.split(':')[0]]
let db = null, user = null, myId = null, canWrite = true, everyone = {}, mine = {}, saving = false, dirty = false
const save = async () => {
  if (saving) { dirty = true; return }
  saving = true
  try { await db.doc(`signoffs/${myId}`).set({ marks: mine }) } catch (e) { console.warn('save failed', e?.code) }
  saving = false
  if (dirty) { dirty = false; save() }
}
const mark = (id, v, note) => {
  if (v == null) delete mine[id]
  else mine[id] = { v, note: note ?? mine[id]?.note ?? '', at: new Date().toISOString() }
  paint()
  save()
}
async function paint() {
  const ids = Object.keys(everyone).filter(u => u !== myId)
  const people = ids.length ? await user.profiles(ids) : {}
  signSlots.forEach(box => {
    if (box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return
    const id = box.dataset.id
    const m = mine[id]
    box.hidden = false
    const note = $('input', { type: 'text', placeholder: 'What’s wrong?', 'aria-label': 'Flag note', value: m?.note || '', disabled: !canWrite })
    note.addEventListener('change', () => mark(id, 'flag', note.value))
    const others = ids.map(u => [u, everyone[u]?.marks?.[id]]).filter(([, x]) => x)
    box.replaceChildren(
      $('button', { class: 'mark ok', type: 'button', disabled: !canWrite, 'aria-pressed': String(m?.v === 'ok'), onclick: () => mark(id, m?.v === 'ok' ? null : 'ok'), text: '✓ Looks right' }),
      $('button', { class: 'mark flag', type: 'button', disabled: !canWrite, 'aria-pressed': String(m?.v === 'flag'), onclick: () => mark(id, m?.v === 'flag' ? null : 'flag'), text: '⚑ Flag' }),
      m?.v === 'flag' ? note : null,
      $('span', { class: 'others' }, others.map(([u, x]) => $('span', { class: `who ${x.v}`, title: x.note || '' }, $('img', { src: people[u]?.avatarUrl || '', alt: '' }), `${people[u]?.name || 'Someone'} ${x.v === 'ok' ? '✓' : '⚑'}`))),
      others.some(([, x]) => x.v === 'flag' && x.note) ? $('ul', { class: 'flagnotes' }, others.filter(([, x]) => x.v === 'flag' && x.note).map(([u, x]) => $('li', { text: `${people[u]?.name || 'Someone'}: ${x.note}` }))) : null)
  })
  const done = units.filter(id => mine[id]).length
  document.getElementById('progress').hidden = false
  document.getElementById('progress-text').textContent = `You: ${done} of ${units.length}`
  document.getElementById('progress-bar').style.width = `${(done / units.length) * 100}%`
  document.querySelectorAll('[data-pass]').forEach(el => {
    const p = el.dataset.pass
    const all = units.filter(id => passOf(id) === p)
    el.textContent = `${all.filter(id => mine[id]).length} of ${all.length} signed off by you`
  })
}
;(async () => {
  if (!window.claude?.use) return
  ;[db, user] = await Promise.all([claude.use('db'), claude.use('user')])
  if (!db || !user) return
  myId = await user.id()
  if (!myId) return
  const can = await user.can('data.write')
  canWrite = can !== false
  const noteEl = document.getElementById('signoff-note')
  noteEl.textContent = can === false ? 'You can see everyone’s sign-offs. Ask the owner for Contributor access to add your own.' : 'Mark each unit “Looks right” or “Flag” with a note. Everyone with access sees everyone’s marks live.'
  const slow = setTimeout(() => { noteEl.textContent = 'Sign-offs can’t be reached yet. Marks you make will save when the connection comes back.' }, 10000)
  db.collection('signoffs').onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(slow)
    everyone = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]))
    if (!saving && !dirty) mine = { ...(everyone[myId]?.marks || {}) }
    paint()
  }, err => { clearTimeout(slow); noteEl.textContent = `Sign-offs are unavailable here (${err.code}).` })
})()
</script>
